name: voople-production

services:
  prepare-next-cache:
    image: ${VOOPLE_IMAGE:?Set VOOPLE_IMAGE in deploy/production/.env}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["mkdir -p /app/.next/cache && chown -R 1001:1001 /app/.next/cache"]
    network_mode: none
    read_only: true
    restart: "no"
    volumes:
      - next-cache:/app/.next/cache
    security_opt:
      - no-new-privileges:true

  web:
    image: ${VOOPLE_IMAGE:?Set VOOPLE_IMAGE in deploy/production/.env}
    depends_on:
      prepare-next-cache:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - app.env
      - cron.env
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - next-cache:/app/.next/cache
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    security_opt:
      - no-new-privileges:true

volumes:
  next-cache:
