[package]
name = "voople-screen-share-worker"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[[bin]]
name = "voople-screen-share-worker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "io-std"] }
livekit = { version = "=0.8.3", features = ["rustls-tls-native-roots"] }
cxx = { version = "=1.0.186" }
voople-screen-share-protocol = { path = "../screen-share-protocol" }

[target.'cfg(windows)'.dependencies]
windows-core = { version = "=0.61.2" }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
] }
