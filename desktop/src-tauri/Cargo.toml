[package]
name = "voople-desktop"
version = "0.1.28"
description = "Voople desktop application"
authors = ["Voople"]
edition = "2021"

[lib]
name = "voople_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
process-audio-publisher = ["dep:livekit", "dep:cxx"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread"] }
livekit = { version = "=0.8.3", features = ["rustls-tls-native-roots"], optional = true }
cxx = { version = "=1.0.186", optional = true }

[target.'cfg(windows)'.dependencies]
windows-core = { version = "=0.61.2" }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
] }
