[package]
name = "voople-desktop"
version = "0.1.39"
description = "Voople desktop application"
authors = ["Voople"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "voople_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Keep the old feature name so existing build commands do not break.
# Native LiveKit is now isolated in the sidecar, so the feature has no Rust dependency payload.
process-audio-publisher = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread"] }
voople-screen-share-protocol = { path = "../screen-share-protocol" }

[target.'cfg(windows)'.dependencies]
windows-core = { version = "=0.61.2" }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
] }
